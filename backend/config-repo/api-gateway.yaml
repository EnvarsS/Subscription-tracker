spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: item-service
              uri: lb://item-service
              predicates:
                - Path=/api/items/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
            - id: dashboard-service
              uri: lb://dashboard-service
              predicates:
                - Path=/api/dashboard/**
            - id: currency-service
              uri: lb://currency-service
              predicates:
                - Path=/api/currencies/**

eureka:
  instance:
    prefer-ip-address: true


